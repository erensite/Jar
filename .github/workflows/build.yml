
name: Build ItemKeeper JAR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -o itemkeeper-project.zip
          find . -name pom.xml

      - name: Build
        run: |
          POM=$(find . -name pom.xml | head -n 1)
          test -n "$POM"
          DIR=$(dirname "$POM")
          mkdir -p "$DIR/libs"
          cp ItemsAdder_4.0.15.jar "$DIR/libs/ItemsAdder_4_0_15.jar"
          cp znpcs-5.3.jar "$DIR/libs/znpcs-5_3.jar"
          cd "$DIR"
          mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: itemkeeper-jar
          path: '**/target/*.jar'
          
